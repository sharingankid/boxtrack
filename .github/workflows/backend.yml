name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boxtrack
          POSTGRES_PASSWORD: boxtrack
          POSTGRES_DB: boxtrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boxtrack -d boxtrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://boxtrack:boxtrack@localhost:5432/boxtrack_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      - name: Create the schema on the CI database
        run: npm run db:setup

      - name: Integration tests (real Postgres)
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env.test
          npm run test:integration
