name: Unbroken
options:
  bundleIdPrefix: com.unbroken
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

targets:
  Unbroken:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Unbroken
    info:
      path: Unbroken/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unbroken.app
        PRODUCT_NAME: Unbroken
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - UnbrokenTests
      gatherCoverageData: true

  UnbrokenTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UnbrokenTests
    dependencies:
      - target: Unbroken
    settings:
      base:
        SWIFT_VERSION: "5.9"
